# Example ESPHome config for the Panasonic R1/R2 bus interface.
# Start listen-only (transmit: false), confirm frames decode with [cs ok] in the logs,
# calibrate setpoint/mode/fan values from your own captures, then enable transmit.
esphome:
  name: panasonic-ac
  friendly_name: Panasonic AC

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [panasonic_rd]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key
  actions:
    # Developer tool: send one register write from Home Assistant, e.g. reg 0x60 value 1.
    - action: send_register
      variables:
        reg: int
        value: int
      then:
        - lambda: 'id(ac).send_register(reg, value);'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

climate:
  - platform: panasonic_rd
    id: ac
    name: Ducted AC
    rx_pin: GPIO27           # receiver collector, external 10k pull-up to 3V3
    tx_pin: GPIO25           # 6N137 LED via 220 ohm
    transmit: false          # flip to true only after the test plan's step 5
    bit_time: 2020us         # use the value the sniffer's `stats` reports
    carrier_frequency: 19200Hz
    # transmit_after: 0x9F   # optional: only start sending right after this poll byte
    setpoint_base: 16        # confirmed: °C = index + 16 (22 °C = index 6)
    setpoint_step: 1
    setpoint_max_index: 14   # 16-30 °C
    mode_values:             # register 0x61, confirmed on a W18BD3P
      cool: 0x02
      heat: 0x01
      dry: 0x04
      fan_only: 0x03
      auto: 0x08
    filter_dirty:
      name: Filter needs cleaning
    fan_values:              # register 0x62, confirmed on a W18BD3P
      low: 0x03
      medium: 0x02
      high: 0x01
      auto: 0x08

button:
  - platform: template
    name: Reset filter warning
    icon: mdi:air-filter
    on_press:
      - lambda: 'id(ac).reset_filter();'   # needs transmit: true

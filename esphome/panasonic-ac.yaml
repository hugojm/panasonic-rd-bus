# Example ESPHome config for the Panasonic R1/R2 bus interface.
# Start listen-only (transmit: false), confirm frames decode with [cs ok] in the logs,
# calibrate setpoint/mode/fan values from your own captures, then enable transmit.
esphome:
  name: panasonic-ac
  friendly_name: Panasonic AC

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [panasonic_rd]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key
  actions:
    # Developer tool: send one register write from Home Assistant, e.g. reg 0x60 value 1.
    - action: send_register
      variables:
        reg: int
        value: int
      then:
        - lambda: 'id(ac).send_register(reg, value);'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

climate:
  - platform: panasonic_rd
    id: ac
    name: Ducted AC
    rx_pin: GPIO34           # H11L1 output, external 4.7k pull-up to 3V3
    tx_pin: GPIO25           # 6N137 LED via 220 ohm
    transmit: false          # flip to true only after the test plan's step 5
    bit_time: 2020us         # use the value the sniffer's `stats` reports
    carrier_frequency: 19200Hz
    # transmit_after: 0x9F   # optional: only start sending right after this poll byte
    setpoint_base: 16        # calibrate: temperature at setpoint index 0
    setpoint_step: 1
    setpoint_max_index: 14
    # mode_values:           # fill in from your captures (register 0x61)
    #   cool: 0x02
    #   heat: 0x01
    fan_values:              # register 0x62, community guess
      low: 0x01
      medium: 0x02
      high: 0x03
      auto: 0x08

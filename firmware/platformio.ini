; Sniffer + experimental transmitter for the Panasonic R1/R2 wired-remote bus.
; Build/flash:  pio run -t upload && pio device monitor
[env:esp32dev]
platform = espressif32@6.12.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = time, log2file
build_flags =
  -I../esphome/components/panasonic_rd
  -DRX_PIN=34
  -DTX_PIN=25
